name: Agent Build (artifact only)

# Supplementary build for agents and anyone without a local Android toolchain.
# It builds the same standalone ARM64 APK as build-apk.yml, but:
#   - never creates releases or tags (read-only token), so the rolling `build-<branch>`
#     releases that the in-app updater reads are never touched;
#   - uses its own concurrency group, so it never cancels or waits on a release build;
#   - signs with the permanent key when available and falls back to a throwaway key,
#     so a missing or broken signing secret does not stop the build;
#   - treats release-only checks (API keys, Firebase, certificate) as warnings, not failures.
# Unit tests and compilation still fail the run: those are real code problems.
#
# Start it from master, with `ref` set to the code to build:
#   gh workflow run agent-build.yml --ref master -f ref=<branch, tag or SHA>
# Then fetch the result:
#   gh run download <run id> -n <artifact name shown in the run summary>
# The artifact holds the APK and build-result.json (sha, signing, sha256, check results).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: true
      signing:
        description: auto = permanent key if the secret works, else throwaway key
        type: choice
        options: [auto, throwaway]
        default: auto

permissions:
  contents: read

concurrency:
  group: agent-build-${{ inputs.ref }}
  cancel-in-progress: true

env:
  BUILD_REF: ${{ inputs.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TELEGRAM_PLUS_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/tgplus-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      TELEGRAM_PLUS_API_ID: ${{ secrets.TELEGRAM_PLUS_API_ID }}
      TELEGRAM_PLUS_API_HASH: ${{ secrets.TELEGRAM_PLUS_API_HASH }}
      TELEGRAM_PLUS_MAPS_API_KEY: ${{ secrets.TELEGRAM_PLUS_MAPS_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Fetch pinned submodules in parallel
        shell: bash
        run: |
          fetch() { git -c protocol.version=2 submodule update --init --force --depth=1 --recursive --jobs 8; }
          fetch || { echo "::warning::Submodule fetch failed, retrying once"; sleep 5; fetch; }
          if git submodule status --recursive | grep -E '^[-+U]'; then
            echo "::error::Some submodules are missing or not at their pinned commit."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/telegram-plus/*Test.java)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::warning::No tests/telegram-plus/*Test.java on this ref; skipping unit tests."
          else
            out="$RUNNER_TEMP/tgplus-tests"
            mkdir -p "$out"
            javac -d "$out" -sourcepath TMessagesProj/src/main/java "${tests[@]}"
            for src in "${tests[@]}"; do
              java -cp "$out" "$(basename "$src" .java)"
            done
          fi
          if [ -f tools/test_push_diagnostics.py ]; then
            python3 tools/test_push_diagnostics.py
          fi

      - name: Prepare signing key
        id: signing
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.TELEGRAM_PLUS_SIGNING_BUNDLE_BASE64 }}
          SIGNING_MODE: ${{ inputs.signing }}
        run: |
          set -euo pipefail
          mode=throwaway
          if [ "$SIGNING_MODE" = auto ] && [ -n "$SIGNING_BUNDLE" ] && [ -f tools/prepare_signing.py ]; then
            if python3 tools/prepare_signing.py; then
              mode=permanent
            else
              echo "::warning::Permanent signing key could not be prepared; using a throwaway key."
            fi
          fi
          if [ "$mode" = throwaway ]; then
            folder="$RUNNER_TEMP/tgplus-signing"
            mkdir -p -m 700 "$folder"
            password=$(python3 -c 'import secrets; print(secrets.token_hex(24))')
            echo "::add-mask::$password"
            rm -f "$folder/throwaway.p12"
            keytool -genkeypair -keystore "$folder/throwaway.p12" -storetype PKCS12 \
              -alias telegram-plus -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Telegram Plus agent build (throwaway)" \
              -storepass "$password" -keypass "$password" >/dev/null
            {
              echo "TELEGRAM_PLUS_KEYSTORE=$folder/throwaway.p12"
              echo "TELEGRAM_PLUS_KEY_ALIAS=telegram-plus"
              echo "TELEGRAM_PLUS_STORE_PASSWORD=$password"
              echo "TELEGRAM_PLUS_KEY_PASSWORD=$password"
            } >> "$GITHUB_ENV"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Signing: $mode"

      - name: Compute build name
        id: meta
        shell: bash
        run: |
          safe_ref=$(printf '%s' "$BUILD_REF" | tr -c 'A-Za-z0-9._-' '-')
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          # "agent" in the name keeps it distinct from the release asset pattern the
          # in-app updater parses (TelegramPlus-<version>-<branch>-build<n>-<sha7>.apk).
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "apk_name=TelegramPlus-agent-${version}-${safe_ref}-run${GITHUB_RUN_NUMBER}-${sha::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Restore native compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/tgplus-ccache
          key: tgplus-native-${{ runner.os }}-ndk27-v1-agent-${{ steps.meta.outputs.sha }}
          restore-keys: |
            tgplus-native-${{ runner.os }}-ndk27-v1-

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build dependencies
        shell: bash
        run: |
          (
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ninja-build nasm yasm pkg-config autoconf automake libtool ccache
          ) &
          apt_pid=$!
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          wait "$apt_pid"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ccache --zero-stats

      - name: Compile standalone ARM64 APK
        run: >-
          gradle :TMessagesProj_AppStandalone:assembleAfatDebug
          --no-daemon --parallel --max-workers=4 --build-cache
          -PRELEASE_STORE_PASSWORD=unused
          -PRELEASE_KEY_PASSWORD=unused
          -PRELEASE_KEY_ALIAS=unused

      - name: Collect APK
        shell: bash
        env:
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected exactly one standalone APK, found ${#apks[@]}."
            exit 1
          fi
          mkdir -p agent-artifact
          cp "${apks[0]}" "agent-artifact/${APK_NAME}.apk"

      # Release-only checks. Each one is reported; none of them fails the run.
      - name: Release checks (warnings only)
        id: checks
        continue-on-error: true
        shell: bash
        env:
          APK: agent-artifact/${{ steps.meta.outputs.apk_name }}.apk
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, subprocess
          from pathlib import Path
          apk = os.environ['APK']
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          results = {}

          def check(name, fn):
              try:
                  results[name] = fn() or 'pass'
              except Exception as error:  # report, never fail the job
                  results[name] = 'warn: ' + (str(error) or type(error).__name__)
                  print(f'::warning title={name}::{results[name]}')

          def api_config():
              files = glob.glob('TMessagesProj/build/generated/source/buildConfig/debug/**/BuildConfig.java', recursive=True)
              if len(files) != 1:
                  raise RuntimeError('expected one generated Telegram BuildConfig')
              source = Path(files[0]).read_text()
              api_id = re.search(r'TELEGRAM_PLUS_API_ID\s*=\s*(\d+)\s*;', source)
              api_hash = re.search(r'TELEGRAM_PLUS_API_HASH\s*=\s*"([a-fA-F0-9]{32})"\s*;', source)
              if not api_id or int(api_id.group(1)) < 1 or not api_hash:
                  raise RuntimeError('generated Telegram API configuration is empty or invalid')
              if api_id.group(1) == '4':
                  return 'pass (upstream sample API credentials)'

          def firebase():
              if not Path('tools/verify_firebase_apk.py').exists():
                  return 'skipped (tool not on this ref)'
              run = subprocess.run(['python3', 'tools/verify_firebase_apk.py'], capture_output=True, text=True)
              if run.returncode:
                  lines = (run.stderr or run.stdout).strip().splitlines()
                  raise RuntimeError(lines[-1] if lines else 'verify_firebase_apk.py failed')

          def signature():
              run = subprocess.run([str(tools / 'apksigner'), 'verify', '--print-certs', apk], capture_output=True, text=True)
              if run.returncode:
                  raise RuntimeError('apksigner verification failed')
              permanent = 'a11bf05dd7c3d8ca457a5fa1204eea3fd0870d2c47853ffc200d3db7a0afad93' in run.stdout.lower()
              if os.environ['SIGNING_MODE'] == 'permanent' and not permanent:
                  raise RuntimeError('signed, but not with the permanent Telegram Plus key')
              return 'pass (permanent key)' if permanent else 'pass (throwaway key: uninstall the release app to install)'

          def package():
              out = subprocess.run([str(tools / 'aapt2'), 'dump', 'badging', apk], capture_output=True, text=True, check=True).stdout
              if "package: name='org.patrick.tgplus.web'" not in out:
                  raise RuntimeError('APK package is not org.patrick.tgplus.web')

          check('api_config', api_config)
          check('firebase', firebase)
          check('signature', signature)
          check('package', package)
          Path(os.environ['RUNNER_TEMP'], 'checks.json').write_text(json.dumps(results))
          PY

      - name: Write build result
        if: always() && steps.meta.outcome == 'success'
        shell: bash
        env:
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p agent-artifact
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('agent-artifact') / (os.environ['APK_NAME'] + '.apk')
          checks_file = Path(os.environ['RUNNER_TEMP'], 'checks.json')
          result = {
              'status': 'success' if apk.exists() and os.environ['JOB_STATUS'] == 'success' else 'failure',
              'ref': os.environ['BUILD_REF'],
              'sha': os.environ['SHA'],
              'version': os.environ['VERSION'],
              'signing': os.environ['SIGNING_MODE'] or 'unknown',
              'apk': apk.name if apk.exists() else None,
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest() if apk.exists() else None,
              'checks': json.loads(checks_file.read_text()) if checks_file.exists() else {},
              'run_url': os.environ['RUN_URL'],
              'artifact': os.environ['APK_NAME'],
          }
          Path('agent-artifact/build-result.json').write_text(json.dumps(result, indent=2) + '\n')
          lines = [f"### Agent build: {result['status']}", '',
                   f"- ref `{result['ref']}` at `{result['sha'][:7]}` (version {result['version']})",
                   f"- signing: {result['signing']}",
                   f"- artifact: `{result['artifact']}`"]
          lines += [f'- check `{k}`: {v}' for k, v in result['checks'].items()]
          lines += ['', f"Download: `gh run download {os.environ['GITHUB_RUN_ID']} -n {result['artifact']}`",
                    '', 'This build is not published as a release.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Report native cache reuse
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove private signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/tgplus-signing"

      - name: Upload APK and build result
        if: always() && steps.meta.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: agent-artifact/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
