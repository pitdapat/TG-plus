name: Build Telegram Plus APK

on:
  push:
    branches: [telegram-plus]
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_AppStandalone/**'
      - 'TMessagesProj_Modules/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.gitmodules'
      - 'tools/prepare_signing.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-plus-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TELEGRAM_PLUS_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/tgplus-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      TELEGRAM_PLUS_API_ID: ${{ secrets.TELEGRAM_PLUS_API_ID }}
      TELEGRAM_PLUS_API_HASH: ${{ secrets.TELEGRAM_PLUS_API_HASH }}
      TELEGRAM_PLUS_MAPS_API_KEY: ${{ secrets.TELEGRAM_PLUS_MAPS_API_KEY }}
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Restore downloaded Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.gradle/caches/modules-2
          key: tgplus-dependencies-${{ runner.os }}-v1-${{ hashFiles('**/*.gradle', 'gradle.properties', '.gitmodules') }}
          restore-keys: |
            tgplus-dependencies-${{ runner.os }}-v1-

      - name: Restore native compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/tgplus-ccache
          key: tgplus-native-${{ runner.os }}-ndk27-v1-${{ github.sha }}
          restore-keys: |
            tgplus-native-${{ runner.os }}-ndk27-v1-

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm yasm pkg-config autoconf automake libtool ccache
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ccache --zero-stats

      - name: Run camera and formatting checks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tgplus-tests"
          javac -d "$RUNNER_TEMP/tgplus-tests" \
            TMessagesProj/src/main/java/org/telegram/messenger/camera/RoundCameraWarmup.java \
            TMessagesProj/src/main/java/org/telegram/messenger/camera/RoundFpsSelector.java \
            TMessagesProj/src/main/java/org/telegram/messenger/camera/RoundStreamSelector.java \
            TMessagesProj/src/main/java/org/telegram/messenger/utils/FormattingMarkers.java \
            tests/telegram-plus/*Test.java
          for test in FormattingMarkersTest RoundCameraWarmupTest RoundFpsSelectorTest RoundStreamSelectorTest; do
            java -cp "$RUNNER_TEMP/tgplus-tests" "$test"
          done

      - name: Run semantic text checks
        run: |
          javac -d "$RUNNER_TEMP/tgplus-tests" TMessagesProj/src/main/java/org/telegram/messenger/semantic/SemanticText.java TMessagesProj/src/main/java/org/telegram/messenger/semantic/SemanticPolicy.java TMessagesProj/src/main/java/org/telegram/messenger/semantic/SemanticTasks.java tests/SemanticTextTest.java tests/SemanticPolicyTest.java
          java -cp "$RUNNER_TEMP/tgplus-tests" SemanticTextTest
          java -cp "$RUNNER_TEMP/tgplus-tests" SemanticPolicyTest

      - name: Restore and verify signing key privately
        env:
          SIGNING_BUNDLE: ${{ secrets.TELEGRAM_PLUS_SIGNING_BUNDLE_BASE64 }}
        run: python3 tools/prepare_signing.py

      - name: Explain API credential status
        shell: bash
        run: |
          if [ -z "$TELEGRAM_PLUS_API_ID" ] || [ -z "$TELEGRAM_PLUS_API_HASH" ]; then
            echo "::notice::Using Telegram public upstream sample API credentials for this personal test build."
            echo "### Personal test APK: upstream sample API credentials included." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Telegram API credentials supplied from repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compile standalone ARM64 APK
        run: >-
          gradle :TMessagesProj_AppStandalone:assembleAfatDebug
          --no-daemon --no-parallel --max-workers=2
          -PRELEASE_STORE_PASSWORD=unused
          -PRELEASE_KEY_PASSWORD=unused
          -PRELEASE_KEY_ALIAS=unused

      - name: Verify compiled API configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          from pathlib import Path
          files = glob.glob('TMessagesProj/build/generated/source/buildConfig/debug/**/BuildConfig.java', recursive=True)
          if len(files) != 1:
              raise SystemExit('Expected one generated Telegram BuildConfig.')
          source = Path(files[0]).read_text()
          api_id = re.search(r'TELEGRAM_PLUS_API_ID\s*=\s*(\d+)\s*;', source)
          api_hash = re.search(r'TELEGRAM_PLUS_API_HASH\s*=\s*"([a-fA-F0-9]{32})"\s*;', source)
          if not api_id or int(api_id.group(1)) < 1 or not api_hash:
              raise SystemExit('Generated Telegram API configuration is empty or invalid.')
          if not os.environ.get('TELEGRAM_PLUS_API_ID') and not os.environ.get('TELEGRAM_PLUS_API_HASH'):
              if api_id.group(1) != '4' or api_hash.group(1) != '014b35b6184100b085b0d0572f9b5103':
                  raise SystemExit('Upstream public test defaults were not compiled correctly.')
          print('Compiled Telegram API configuration verified; values are not logged.')
          PY

      - name: Verify APK signature and package
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          from pathlib import Path
          files = glob.glob('TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/*.apk')
          if len(files) != 1:
              raise SystemExit('Expected exactly one standalone APK.')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          verified = subprocess.run([str(tools/'apksigner'), 'verify', '--print-certs', files[0]], capture_output=True, text=True)
          if verified.returncode:
              raise SystemExit('APK signature verification failed.')
          expected = 'a11bf05dd7c3d8ca457a5fa1204eea3fd0870d2c47853ffc200d3db7a0afad93'
          if expected not in verified.stdout.lower():
              raise SystemExit('APK signing certificate does not match the permanent key.')
          package = subprocess.run([str(tools/'aapt2'), 'dump', 'badging', files[0]], capture_output=True, text=True, check=True)
          if "package: name='org.patrick.tgplus.web'" not in package.stdout:
              raise SystemExit('APK package is not the intended side-by-side application.')
          target = Path('apk-artifact')
          target.mkdir(exist_ok=True)
          (target/'Telegram_Plus.apk').write_bytes(Path(files[0]).read_bytes())
          print('APK signature and side-by-side package verified.')
          PY

      - name: Report native cache reuse
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove private signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/tgplus-signing"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Telegram-Plus-ARM64-${{ github.run_number }}
          path: apk-artifact/Telegram_Plus.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14


