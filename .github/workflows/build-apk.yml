name: Build Telegram Plus APK

# One workflow for every branch. It builds the signed side-by-side app
# (org.patrick.tgplus.web) and publishes it as a rolling GitHub Release per branch.
#
# MANUAL ONLY: pushing does not start a build, so work can be iterated freely.
# Start a build from the Actions tab ("Run workflow") or with:
#   gh workflow run build-apk.yml --ref master -f ref=<branch, tag or SHA>
# The `ref` input is the code that gets built. The workflow file itself is taken from
# the branch chosen in "Use workflow from" (use master), so the target branch does not
# need its own copy.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (blank = the branch this run was started on)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # One build per branch; a newer run for the same branch replaces the older one.
  group: telegram-plus-apk-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

env:
  BRANCH: ${{ inputs.ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      branch: ${{ steps.meta.outputs.safe_branch }}
      artifact: ${{ steps.meta.outputs.apk_name }}
      apk_name: ${{ steps.meta.outputs.apk_name }}.apk
    env:
      TELEGRAM_PLUS_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.cache/tgplus-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      TELEGRAM_PLUS_API_ID: ${{ secrets.TELEGRAM_PLUS_API_ID }}
      TELEGRAM_PLUS_API_HASH: ${{ secrets.TELEGRAM_PLUS_API_HASH }}
      TELEGRAM_PLUS_MAPS_API_KEY: ${{ secrets.TELEGRAM_PLUS_MAPS_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # actions/checkout fetches ~20 submodules one at a time (~60s). Doing it here with
      # --jobs takes ~15s. All submodules are public, so no credentials are needed.
      - name: Fetch pinned submodules in parallel
        shell: bash
        run: |
          fetch() { git -c protocol.version=2 submodule update --init --force --depth=1 --recursive --jobs 8; }
          fetch || { echo "::warning::Submodule fetch failed, retrying once"; sleep 5; fetch; }
          # '-' = not fetched, '+' = checked out at a commit other than the pinned one.
          if git submodule status --recursive | grep -E '^[-+U]'; then
            echo "::error::Some submodules are missing or not at their pinned commit."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      # Cheap checks run first so a bad commit or missing secret fails in seconds,
      # before the SDK download and the native build.
      - name: Run unit tests
        shell: bash
        run: |
          # -sourcepath compiles only the app classes each test imports, and every
          # tests/telegram-plus/*Test.java is run, so no per-branch test list is needed.
          out="$RUNNER_TEMP/tgplus-tests"
          mkdir -p "$out"
          javac -d "$out" -sourcepath TMessagesProj/src/main/java tests/telegram-plus/*Test.java
          for src in tests/telegram-plus/*Test.java; do
            java -cp "$out" "$(basename "$src" .java)"
          done
          python3 tools/test_push_diagnostics.py

      - name: Restore and verify signing key privately
        env:
          SIGNING_BUNDLE: ${{ secrets.TELEGRAM_PLUS_SIGNING_BUNDLE_BASE64 }}
        run: python3 tools/prepare_signing.py

      - name: Compute build name
        id: meta
        shell: bash
        run: |
          safe_branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          # Unique per build, so phones save each download under its own name.
          # The in-app updater parses this exact pattern.
          {
            echo "sha=$sha"
            echo "safe_branch=$safe_branch"
            echo "apk_name=TelegramPlus-${version}-${safe_branch}-build${GITHUB_RUN_NUMBER}-${sha::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: '8.13'
          # Caches downloaded dependencies, transforms and the build cache.
          # Every branch may write so feature branches stay fast.
          cache-read-only: false

      - name: Restore native compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/tgplus-ccache
          key: tgplus-native-${{ runner.os }}-ndk27-v1-${{ steps.meta.outputs.sha }}
          restore-keys: |
            tgplus-native-${{ runner.os }}-ndk27-v1-

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build dependencies
        shell: bash
        run: |
          # apt packages and the SDK/NDK download are independent, so run them together.
          (
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ninja-build nasm yasm pkg-config autoconf automake libtool ccache
          ) &
          apt_pid=$!
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          wait "$apt_pid"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ccache --zero-stats

      - name: Compile standalone ARM64 APK
        run: >-
          gradle :TMessagesProj_AppStandalone:assembleAfatDebug
          --no-daemon --parallel --max-workers=4 --build-cache
          -PRELEASE_STORE_PASSWORD=unused
          -PRELEASE_KEY_PASSWORD=unused
          -PRELEASE_KEY_ALIAS=unused

      - name: Verify API configuration, Firebase, signature and package
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          from pathlib import Path
          files = glob.glob('TMessagesProj/build/generated/source/buildConfig/debug/**/BuildConfig.java', recursive=True)
          if len(files) != 1:
              raise SystemExit('Expected one generated Telegram BuildConfig.')
          source = Path(files[0]).read_text()
          api_id = re.search(r'TELEGRAM_PLUS_API_ID\s*=\s*(\d+)\s*;', source)
          api_hash = re.search(r'TELEGRAM_PLUS_API_HASH\s*=\s*"([a-fA-F0-9]{32})"\s*;', source)
          if not api_id or int(api_id.group(1)) < 1 or not api_hash:
              raise SystemExit('Generated Telegram API configuration is empty or invalid.')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if not os.environ.get('TELEGRAM_PLUS_API_ID') and not os.environ.get('TELEGRAM_PLUS_API_HASH'):
              if api_id.group(1) != '4' or api_hash.group(1) != '014b35b6184100b085b0d0572f9b5103':
                  raise SystemExit('Upstream public test defaults were not compiled correctly.')
              note = 'Personal test APK: upstream sample API credentials included.'
              print('::notice::' + note)
          else:
              note = 'Telegram API credentials supplied from repository secrets.'
          with summary.open('a') as out:
              out.write('### ' + note + '\n')
          print('Compiled Telegram API configuration verified; values are not logged.')
          PY
          python3 tools/verify_firebase_apk.py
          python3 - <<'PY'
          import glob, os, subprocess
          from pathlib import Path
          files = glob.glob('TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/*.apk')
          if len(files) != 1:
              raise SystemExit('Expected exactly one standalone APK.')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          verified = subprocess.run([str(tools/'apksigner'), 'verify', '--print-certs', files[0]], capture_output=True, text=True)
          if verified.returncode:
              raise SystemExit('APK signature verification failed.')
          expected = 'a11bf05dd7c3d8ca457a5fa1204eea3fd0870d2c47853ffc200d3db7a0afad93'
          if expected not in verified.stdout.lower():
              raise SystemExit('APK signing certificate does not match the permanent key.')
          package = subprocess.run([str(tools/'aapt2'), 'dump', 'badging', files[0]], capture_output=True, text=True, check=True)
          if "package: name='org.patrick.tgplus.web'" not in package.stdout:
              raise SystemExit('APK package is not the intended side-by-side application.')
          target = Path('apk-artifact')
          target.mkdir(exist_ok=True)
          (target/'Telegram_Plus.apk').write_bytes(Path(files[0]).read_bytes())
          print('APK signature and side-by-side package verified.')
          PY

      - name: Report native cache reuse
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove private signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/tgplus-signing"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: apk-artifact/Telegram_Plus.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Separate job so only this small step gets write access to the repository.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: telegram-plus-release-${{ inputs.ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apk

      - name: Publish APK to the branch's GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SAFE_BRANCH: ${{ needs.build.outputs.branch }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          SHA: ${{ needs.build.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="build-${SAFE_BRANCH}"
          cp apk/Telegram_Plus.apk "$APK_NAME"
          notes="Latest signed build of branch \`${BRANCH}\` (commit ${SHA::7}, run #${GITHUB_RUN_NUMBER}).

          Package org.patrick.tgplus.web, signed with the permanent Telegram Plus key. Installs as an update.

          Build log: ${RUN_URL}"
          # One rolling release per branch: replace the previous build of this branch.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          flags=(--prerelease)
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then flags=(--latest); fi
          gh release create "$tag" "$APK_NAME" \
            --target "$SHA" \
            --title "Telegram Plus (${BRANCH}) - build #${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            "${flags[@]}"
          url="${GITHUB_SERVER_URL}/${GH_REPO}/releases/download/${tag}/${APK_NAME}"
          page="${GITHUB_SERVER_URL}/${GH_REPO}/releases/tag/${tag}"
          echo "### APK download: ${url}" >> "$GITHUB_STEP_SUMMARY"
          echo "Always-current page for this branch: ${page}" >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${url}"
